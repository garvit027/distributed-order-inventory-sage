spring.application.name=order-service

# --- HTTP (public edge) ---
server.port=${SERVER_PORT:8080}

# --- gRPC server ---
grpc.port=${GRPC_PORT:50051}

# --- Datasource (H2 file) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/order-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Instant -> ISO-8601 "Z" strings in the order JSON (camelCase is Jackson default)
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Orchestrator gRPC client target ---
orchestrator.service.host=${ORCHESTRATOR_SERVICE_HOST:localhost}
orchestrator.service.port=${ORCHESTRATOR_SERVICE_PORT:50052}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
