spring.application.name=orchestrator

# --- HTTP (probes / actuator only; local default differs from order-service) ---
server.port=${SERVER_PORT:8084}

# --- gRPC server ---
grpc.port=${GRPC_PORT:50052}

# --- Datasource (H2 file) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/orchestrator-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Downstream gRPC targets ---
order.service.host=${ORDER_SERVICE_HOST:localhost}
order.service.port=${ORDER_SERVICE_PORT:50051}
inventory.service.host=${INVENTORY_SERVICE_HOST:localhost}
inventory.service.port=${INVENTORY_SERVICE_PORT:50053}
payment.service.host=${PAYMENT_SERVICE_HOST:localhost}
payment.service.port=${PAYMENT_SERVICE_PORT:50054}
notification.service.host=${NOTIFICATION_SERVICE_HOST:localhost}
notification.service.port=${NOTIFICATION_SERVICE_PORT:50055}

# --- Retry / execution knobs ---
orchestrator.grpc.deadline-ms=${ORCHESTRATOR_GRPC_DEADLINE_MS:10000}
orchestrator.max-retries=${ORCHESTRATOR_MAX_RETRIES:3}
orchestrator.retry-backoff-ms=${ORCHESTRATOR_RETRY_BACKOFF_MS:250}
orchestrator.workers=${ORCHESTRATOR_WORKERS:4}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
