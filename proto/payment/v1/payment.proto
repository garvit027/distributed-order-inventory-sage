syntax = "proto3";

package payment.v1;

option java_package = "com.doiwsc.payment.v1";
option java_multiple_files = true;

// PaymentService captures (Charge) and reverses (Refund) payments.
// Business outcomes are response fields, not gRPC status codes.
service PaymentService {
  // Charge attempts to capture amount_cents. Retrying with the same
  // idempotency_key never double-charges: a successful charge is returned
  // as-is, a failed charge replays the same failure.
  rpc Charge(ChargeRequest) returns (ChargeResponse);

  // Refund is the compensating transaction for a Charge. Idempotent by key:
  // refunding the same payment twice with the same key charges once.
  rpc Refund(RefundRequest) returns (RefundResponse);
}

message ChargeRequest {
  string idempotency_key = 1;
  string order_id = 2;
  string customer_id = 3;
  int64 amount_cents = 4;
  string currency = 5;
}

message ChargeResponse {
  bool charged = 1;
  // Set when charged == true.
  string payment_id = 2;
  // Machine-readable failure when charged == false,
  // e.g. "CARD_DECLINED", "INVALID_AMOUNT".
  string failure_reason = 3;
}

message RefundRequest {
  string idempotency_key = 1;
  string payment_id = 2;
  string order_id = 3;
}

message RefundResponse {
  bool refunded = 1;
  string failure_reason = 2;
}
