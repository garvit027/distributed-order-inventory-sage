name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create venv
        run: make venv
      - name: Check proto generation script still works
        # gen/python is committed; this only proves the generator is healthy.
        run: make protos
      - name: Run Python service + consumer contract tests
        # The consumer tests also write the pact files into pacts/.
        run: .venv/bin/python -m pytest services contracts -q
      - name: Upload pact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: pacts/*.json
          if-no-files-found: error

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: order-service tests
        run: mvn -q test
        working-directory: services/order-service
      - name: orchestrator tests
        run: mvn -q test
        working-directory: services/orchestrator

  pact-verify:
    # Provider-side verification: order-service replays the pacts produced by
    # the Python consumer tests (contract §3.8).
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Download pact artifacts
        uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts/
      - name: Verify pacts (provider)
        run: mvn -q verify
        working-directory: services/order-service

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint + template
        run: make helm-lint

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order
            dockerfile: services/order-service/Dockerfile
          - service: orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - service: inventory
            dockerfile: services/inventory/Dockerfile
          - service: payment
            dockerfile: services/payment/Dockerfile
          - service: notification
            dockerfile: services/notification/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: docker build -f "${{ matrix.dockerfile }}" .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create venv
        run: make venv
      - name: Start the stack
        run: docker compose up -d --build
      - name: Run end-to-end scenarios
        run: bash scripts/e2e.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
